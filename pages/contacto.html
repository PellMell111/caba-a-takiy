        <main class="main-contacto">
            <form action="#" method="post">
                <div class="contact-form">
                    <!-- Campo Nombre (CORREGIDO) -->
                    <h4>Ponte en contacto con nosotros</h4>
                    <div>
                        <label for="name" class="contact-line">Nombre:</label>
                        <br>
                        <input type="text" id="name" name="name" required class="contact-line">
                    </div>
                    
                    <!-- Campo Email (ya estaba bien) -->
                    <div>
                        <label for="email" class="contact-line">Email:</label>
                        <br>
                        <input type="email" id="email" name="email" required class="contact-line">
                    </div>
                    
                    <!-- Campo Teléfono (ya estaba bien) -->
                    <div>
                        <label for="phone" class="contact-line">Teléfono:</label>
                        <br>
                        <input type="tel" id="phone" name="phone" class="contact-line">
                    </div>
                    
                    <!-- Campo Mensaje (ya estaba bien) -->
                    <div>
                        <label for="message" class="contact-line">Mensaje:</label>
                        <br>
                        <textarea id="message" name="message" rows="5" required class="contact-line"></textarea>
                    </div>
                    
                    <!-- Botón de envío (ya estaba bien) -->
                    <div>
                        <button type="submit" class="contact-line">Enviar</button>
                    </div>
                </div>
            </form>
